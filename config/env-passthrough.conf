# Environment variables passed through to sandboxed MCP sessions.
# One variable name per line. Lines starting with # are comments.
#
# Everything NOT listed here is stripped by env -i in sandboxed-shell.sh.
# This prevents secret leakage from the parent environment
# (e.g. GITHUB_TOKEN, AWS_SECRET_ACCESS_KEY).
#
# PATH is NOT configurable here — it is hardcoded in sandboxed-shell.sh
# to /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
# to ensure Homebrew tools are available without inheriting a tampered PATH.
# Adding PATH to this file has no effect — it is silently skipped.
#
# To add a variable: add its name on a new line and reopen the sandboxed tab.
# To remove one: delete or comment out the line.

HOME
USER
SHELL
TERM
LANG
TMPDIR
